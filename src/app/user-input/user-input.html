<form (ngSubmit)="calculateInvestment()">
  <div class="input-group">
    <p>
      <label for="initialInvestment">Initial Investment:</label>
      <input type="number" id="initialInvestment" name="initialInvestment" [(ngModel)]="initialInvestment">
    </p>
    <p>
      <label for="annualContribution">Annual Investment:</label>
      <input type="number" id="annualContribution" name="annualContribution" [(ngModel)]="annualContribution">
    </p>
  </div>
  <div class="input-group">
    <p>
      <label for="annualReturn">Expected Annual Return (%):</label>
      <input type="number" id="annualReturn" name="annualReturn" [(ngModel)]="annualReturn">
    </p>
    <p>
      <label for="investmentDuration">Investment Duration (years):</label>
      <input type="number" id="investmentDuration" name="investmentDuration" [(ngModel)]="investmentDuration">
    </p>
  </div>
  <p>
    <button>Calculate</button>
  </p>
</form>
